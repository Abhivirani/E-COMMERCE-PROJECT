spring.application.name=api-gateway
server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}

# User Service Route
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**

# Product Service Route
spring.cloud.gateway.server.webflux.routes[1].id=product-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://PRODUCT
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/products/**

# Order Service Route
spring.cloud.gateway.server.webflux.routes[2].id=order-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ORDER
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/cart/**,/api/orders/**

# User Authentication Route
spring.cloud.gateway.server.webflux.routes[3].id=user-auth-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://USER
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/auth/**

# KEYCLOAK

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/ecommerce

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.cloud.gateway=DEBUG

# AI Assistant Route
spring.cloud.gateway.server.webflux.routes[4].id=ai-assistant
spring.cloud.gateway.server.webflux.routes[4].uri=lb://AI-ASSISTANT
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/ai/**

# Actuator Health Check
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never