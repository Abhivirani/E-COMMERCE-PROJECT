name: E-Commerce Microservices CI

on:
  push:
    paths:
      - "ai-assistant/**"
      - "api-gateway/**"
      - "eureka/**"
      - "notification/**"
      - "Order/**"
      - "Product/**"
      - "user/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "ai-assistant/**"
      - "api-gateway/**"
      - "eureka/**"
      - "notification/**"
      - "Order/**"
      - "Product/**"
      - "user/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - ai-assistant
          - api-gateway
          - eureka
          - notification
          - Order
          - Product
          - user

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Build and run tests
        working-directory: ${{ matrix.service }}
        run: |
          chmod +x ./mvnw
          ./mvnw clean verify
