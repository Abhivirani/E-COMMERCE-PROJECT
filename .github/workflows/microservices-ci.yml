name: E-Commerce Microservices CI

permissions:
  contents: read
  packages: write

on:
  push:
    paths:
      - "ai-assistant/**"
      - "api-gateway/**"
      - "eureka/**"
      - "notification/**"
      - "Order/**"
      - "Product/**"
      - "user/**"
      - ".github/workflows/**"

  pull_request:
    paths:
      - "ai-assistant/**"
      - "api-gateway/**"
      - "eureka/**"
      - "notification/**"
      - "Order/**"
      - "Product/**"
      - "user/**"
      - ".github/workflows/**"

  workflow_dispatch:

jobs:
  build-and-test:
    name: Build ${{ matrix.service.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: ai-assistant
            database: productdb
            eurekaClientEnabled: "false"

          - name: api-gateway
            database: productdb
            eurekaClientEnabled: "false"

          - name: eureka
            database: productdb
            eurekaClientEnabled: "true"

          - name: notification
            database: productdb
            eurekaClientEnabled: "false"

          - name: Order
            database: orderdb
            eurekaClientEnabled: "false"

          - name: Product
            database: productdb
            eurekaClientEnabled: "false"

          - name: user
            database: userdb
            eurekaClientEnabled: "false"

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:4.0-management
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ matrix.service.database }}
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      SPRING_RABBITMQ_HOST: localhost
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest

      EUREKA_CLIENT_ENABLED: ${{ matrix.service.eurekaClientEnabled }}
      SPRING_CLOUD_DISCOVERY_ENABLED: ${{ matrix.service.name == 'eureka' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: ${{ matrix.service.name }}/pom.xml

      - name: Create test databases
        run: |
          for db in productdb product_testdb orderdb userdb; do
            psql -h localhost -U postgres -d postgres \
              -tc "SELECT 1 FROM pg_database WHERE datname = '$db'" |
              grep -q 1 || \
              psql -h localhost -U postgres -d postgres \
              -c "CREATE DATABASE $db"
          done
        env:
          PGPASSWORD: postgres

      - name: Build and run tests
        working-directory: ${{ matrix.service.name }}
        run: |
          chmod +x ./mvnw
          ./mvnw clean verify


  docker-publish:
    name: Docker Publish ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: build-and-test

    if: github.repository == 'Abhivirani/E-COMMERCE-PROJECT' && github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: ai-assistant
            directory: ai-assistant

          - name: api-gateway
            directory: api-gateway

          - name: eureka
            directory: eureka

          - name: notification
            directory: notification

          - name: order
            directory: Order

          - name: product
            directory: Product

          - name: user
            directory: user

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: ${{ matrix.service.directory }}/pom.xml

      - name: Build JAR
        working-directory: ${{ matrix.service.directory }}
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

      - name: Set image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service.name }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        working-directory: ${{ matrix.service.directory }}
        run: |
          docker build \
            -t "$IMAGE_NAME:latest" \
            -t "$IMAGE_NAME:${GITHUB_SHA}" \
            .

          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${GITHUB_SHA}"

  deploy:
    name: Deploy to Local Docker
    runs-on: [self-hosted, Windows, X64]
    needs: docker-publish

    if: github.repository == 'Abhivirani/E-COMMERCE-PROJECT' && github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Pull latest application images
        working-directory: D:\E-COMMERCE-PROJECT
        shell: powershell
        run: |
          docker compose pull eureka notification product user ai-assistant api-gateway order

      - name: Restart application services
        working-directory: D:\E-COMMERCE-PROJECT
        shell: powershell
        run: |
          docker compose up -d --no-deps eureka notification product user ai-assistant api-gateway order

      - name: Verify application health
        working-directory: D:\E-COMMERCE-PROJECT
        shell: powershell
        run: |
          $services = @(
            "eureka",
            "product",
            "user",
            "order",
            "notification",
            "api-gateway",
            "ai-assistant"
          )

          $unhealthy = @()

          foreach ($service in $services) {
            $status = docker inspect --format='{{.State.Health.Status}}' "ecom-$service"

            Write-Host "$service : $status"

            if ($status -ne "healthy") {
              $unhealthy += $service
            }
          }

          if ($unhealthy.Count -gt 0) {
            Write-Error "Unhealthy services: $($unhealthy -join ', ')"
            exit 1
          }

          Write-Host "All application services are healthy."
