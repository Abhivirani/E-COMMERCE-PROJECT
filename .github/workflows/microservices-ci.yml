name: E-Commerce Microservices CI

on:
  push:
    paths:
      - "ai-assistant/**"
      - "api-gateway/**"
      - "eureka/**"
      - "notification/**"
      - "Order/**"
      - "Product/**"
      - "user/**"
      - ".github/workflows/**"

  pull_request:
    paths:
      - "ai-assistant/**"
      - "api-gateway/**"
      - "eureka/**"
      - "notification/**"
      - "Order/**"
      - "Product/**"
      - "user/**"
      - ".github/workflows/**"

  workflow_dispatch:

jobs:
  build-and-test:
    name: Build ${{ matrix.service.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: ai-assistant
            database: productdb
            eurekaClientEnabled: "false"

          - name: api-gateway
            database: productdb
            eurekaClientEnabled: "false"

          - name: eureka
            database: productdb
            eurekaClientEnabled: "true"

          - name: notification
            database: productdb
            eurekaClientEnabled: "false"

          - name: Order
            database: orderdb
            eurekaClientEnabled: "false"

          - name: Product
            database: productdb
            eurekaClientEnabled: "false"

          - name: user
            database: userdb
            eurekaClientEnabled: "false"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ matrix.service.database }}
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      SPRING_RABBITMQ_HOST: localhost
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest

      EUREKA_CLIENT_ENABLED: ${{ matrix.service.eurekaClientEnabled }}
      SPRING_CLOUD_DISCOVERY_ENABLED: ${{ matrix.service.name == 'eureka' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: ${{ matrix.service.name }}/pom.xml

      - name: Create test databases
        run: |
          for db in productdb product_testdb orderdb userdb; do
            psql -h localhost -U postgres -d postgres \
              -tc "SELECT 1 FROM pg_database WHERE datname = '$db'" |
              grep -q 1 || \
              psql -h localhost -U postgres -d postgres \
              -c "CREATE DATABASE $db"
          done
        env:
          PGPASSWORD: postgres

      - name: Build and run tests
        working-directory: ${{ matrix.service.name }}
        run: |
          chmod +x ./mvnw
          ./mvnw clean verify