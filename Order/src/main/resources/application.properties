spring.application.name=Order

server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/orderdb
spring.datasource.username=postgres
spring.datasource.password=Abhi@1411

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator Health Check
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.info.env.enabled=true

info.app.name=Order Service
info.app.version=1.0
info.app.author=Abhi

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}

rabbitmq.exchange.name=ecommerce.exchange
rabbitmq.queue.order=order.queue
rabbitmq.queue.notification=notification.queue
rabbitmq.routing.order=order.created
rabbitmq.routing.notification=notification.created

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/ecommerce
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security.oauth2=TRACE
logging.level.org.springframework.web=DEBUG

# ==========================================
# Resilience4j Circuit Breaker
# ==========================================

resilience4j.circuitbreaker.instances.productService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.productService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.productService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.productService.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.productService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.productService.automaticTransitionFromOpenToHalfOpenEnabled=true

# ==========================================
# Retry Configuration
# ==========================================

resilience4j.retry.instances.productService.maxAttempts=3
resilience4j.retry.instances.productService.waitDuration=500ms

# ==========================
# TimeLimiter
# ==========================

resilience4j.timelimiter.instances.productService.timeoutDuration=2s
resilience4j.timelimiter.instances.productService.cancelRunningFuture=true
resilience4j.circuitbreaker.instances.productService.minimumNumberOfCalls=5

# OAuth2 client registration for Order Service
spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.client-id=order-service
spring.security.oauth2.client.registration.keycloak.client-secret=${ORDER_SERVICE_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=client_credentials

# Keycloak token endpoint
spring.security.oauth2.client.provider.keycloak.token-uri=http://host.docker.internal:9090/realms/ecommerce/protocol/openid-connect/token

# Local Saga payment-failure simulation (disabled by default)
payment.simulation.fail=false